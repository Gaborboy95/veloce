name: veloce_lua_native
description: Sandboxed Lua 5.4 native runtime for the Veloce Lua plugin system.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.4
  veloce_lua_core:
    path: ../veloce_lua_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.8

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
