name: veloce_lua_native
description: Sandboxed Lua 5.4 native runtime for the Veloce Lua plugin system.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  veloce_lua_core:
    path: ../veloce_lua_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true

